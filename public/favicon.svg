  <g stroke="#c9a227" fill="none" stroke-linecap="round">
    <circle cx="16" cy="16" r="11.5" stroke-width="1.1" opacity="0.45"/>
    <path d="M16 4.5v23" stroke-width="1.1" opacity="0.45"/>
    <path d="M16 7.5v11.5" stroke-width="1.8"/>
  </g>
  <circle cx="16" cy="21.6" r="2.7" fill="#c9a227"/>
</svg>
